name: Test Crawlee (capacité scraping jobboards)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Playwright + Chromium (avec dépendances système)
        run: npx playwright install --with-deps chromium

      - name: Lancer le test de capacité
        run: npx tsx scripts/test-crawlee.ts
