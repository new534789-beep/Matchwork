name: Crons Matchwork

on:
  schedule:
    # RSS (toutes sources génériques) — 2x/jour, tous les jours. L'index du
    # lot (0-13) est calculé dans le job à partir du jour + créneau, pour
    # visiter la totalité du catalogue de sources actives une fois par semaine.
    - cron: "0 5,17 * * *"
    # Bots par type de source — 1x/jour chacun, décorrélés de l'ingestion RSS
    # (avant : tout bundlé dans un seul appel dispatcher qui dépassait
    # régulièrement les 60s du plan Hobby et échouait ~1 jour sur 2).
    - cron: "0 6 * * *"   # bourses
    - cron: "0 7 * * *"   # emplois (ATS)
    - cron: "0 8 * * *"   # stages
    - cron: "0 9 * * *"   # formations
    - cron: "0 10 * * *"  # admissions
    - cron: "0 11 * * *"  # appels à projets
    # Nettoyage/entretien (expiration, enrichissement, rafraîchissement) —
    # rapide (jamais bundlé avec l'ingestion), donc peut tourner souvent.
    - cron: "0 12,22 * * *"
    # Enrichissement IA des brouillons — toutes les 2h
    - cron: "0 0,2,4,14,16,18,20 * * *"
    # Auto-validation — toutes les 4h (décalé de 1h)
    - cron: "0 1,13,21 * * *"
    # Fonctionnalités Pro (notifications) — jamais déclenchées avant ce
    # correctif (aucun cron ni Vercel ni GitHub Actions ne les appelait).
    - cron: "0 3 * * *"   # alertes intelligentes
    - cron: "0 15 * * *"  # checklist post-obtention
    - cron: "0 19 * * *"  # relance candidature
  workflow_dispatch:

jobs:
  rss:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 5,17 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Calculer le lot du jour et appeler /api/cron/ingestion
        run: |
          HOUR=$(date -u +%H)
          DOW=$(date -u +%u)
          SLOT=0
          if [ "$HOUR" -ge 12 ]; then SLOT=1; fi
          INDEX=$(( (DOW - 1) * 2 + SLOT ))
          curl -sf -X GET "https://matchworks.app/api/cron/ingestion?diviseur=14&index=$INDEX" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  bourses:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * *'
    runs-on: ubuntu-latest
    steps:
      # limit doit rester SOUS le nombre total de sources (31) : au-delà, le
      # scraper désactive son mode "léger" (pagination) et charge tout en un
      # bloc avec des paramètres plus lourds — a fait planter la fonction par
      # manque de mémoire (OOM) lors du test. offset tourne sur 4 jours pour
      # couvrir la totalité des sources sans jamais dépasser cette limite.
      - run: |
          DOW=$(date -u +%u)
          OFFSET=$(( ((DOW - 1) % 4) * 10 ))
          curl -sf -X GET "https://matchworks.app/api/cron/ingestion-bourses?offset=$OFFSET&limit=10" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  emplois:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * *'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -X GET "https://matchworks.app/api/cron/ingestion-emplois" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  stages:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *'
    runs-on: ubuntu-latest
    steps:
      # Même logique que "bourses" : limit sous le total (21 sources), offset
      # tourne sur 3 jours pour couvrir la totalité sans jamais désactiver le
      # mode léger du scraper (voir commentaire du job bourses).
      - run: |
          DOW=$(date -u +%u)
          OFFSET=$(( ((DOW - 1) % 3) * 8 ))
          curl -sf -X GET "https://matchworks.app/api/cron/ingestion-stages?offset=$OFFSET&limit=8" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  formations:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * *'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -X GET "https://matchworks.app/api/cron/ingestion-formations" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  admissions:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * *'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -X GET "https://matchworks.app/api/cron/ingestion-admissions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  appels-projets:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * *'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -X GET "https://matchworks.app/api/cron/dispatcher?force=appels-projets" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  nettoyage:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 12,22 * * *'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -X GET "https://matchworks.app/api/cron/dispatcher" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  enrichir:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0,2,4,14,16,18,20 * * *'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -X GET "https://matchworks.app/api/cron/enrichir?limite=25" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  auto-validation:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1,13,21 * * *'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -X GET "https://matchworks.app/api/cron/auto-validation?limite=60" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  alertes-intelligentes:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -X GET "https://matchworks.app/api/cron/alertes-intelligentes" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  checklist-post-obtention:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 15 * * *'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -X GET "https://matchworks.app/api/cron/checklist-post-obtention" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  relance-candidature:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 19 * * *'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -X GET "https://matchworks.app/api/cron/relance-candidature" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
